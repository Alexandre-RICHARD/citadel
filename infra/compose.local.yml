# =====================================================================================
# compose.local.yml : faire tourner la prod sur ton PC, pour la tester avant une release
# =====================================================================================
#
#   pnpm prod:local        construit nos images en local et lance tout : site, Caddy,
#                          infra-ops et la stack média
#   pnpm prod:local:down   arrête tout et efface ses données (volumes compris)
#
# Puis :
#   https://citadel.localhost:8443            le site (accepter l'avertissement : certificat de test)
#   https://jellyfin.citadel.localhost:8443   Jellyfin, à travers Caddy (ou http://localhost:8096)
#   http://localhost:8100                     la console (mot de passe : admin)
#   http://localhost:8080                     qBittorrent (admin / adminadmin) ; 9696 Prowlarr,
#                                             7878 Radarr, 8989 Sonarr, 6767 Bazarr, 2468 cross-seed
#
# Ce fichier ne remplace pas compose.yml : Compose le superpose à lui (deuxième -f).
# On teste donc le vrai compose.yml (lecture seule, utilisateurs, healthchecks, réseaux,
# limites, Caddyfile), avec seulement ces différences :
#   - nos images sont construites depuis le Dockerfile, au lieu d'être tirées de GHCR ;
#   - les dossiers du NAS (/Volume1/…, /Volume2/…) deviennent des volumes Docker neufs,
#     effacés par prod:local:down : chaque test part de zéro, sans rien toucher sur le NAS ;
#   - les ports sont publiés sur 127.0.0.1 de ton PC seulement ;
#   - le domaine est citadel.localhost : Caddy le sert avec ses propres certificats de
#     test, sans Let's Encrypt ni Cloudflare. Les navigateurs envoient *.localhost sur
#     ton PC, sans rien configurer ;
#   - un FAUX Gluetun (voir media-gluetun plus bas) : ni VPN, ni clé sur ton PC ;
#   - qBittorrent part avec un compte connu, que la console utilise ;
#   - Jellyfin sans transcodage matériel, Tailscale absent (il n'existe que sur le NAS) ;
#   - un FAUX Drive pour les sauvegardes : le même chiffrement rclone, sur un volume
#     Docker, et aucun signal à healthchecks.io.
# Les jobs se lancent à la main : docker exec infra-ops citadel db-backup (puis
# db-restore-test, config-backup, config-verify, update-check…).
# Les valeurs viennent du .env de la racine (identifiants IGDB) et de compose.local.env.
#
# `!override` remplace une liste au lieu de la compléter (sinon les ports du NAS
# resteraient publiés en plus des nôtres) ; `!reset` l'efface.
# Pour les volumes, pas besoin : Compose remplace un montage qui a la même destination.

services:
  site-prod-db:
    volumes:
      # Mêmes destinations que dans compose.yml : Compose remplace ces deux montages
      - db-data:/var/lib/mysql
      - type: bind
        source: ./mariadb-init.sh
        target: /docker-entrypoint-initdb.d/citadel.sh
        read_only: true
    ports: !override
      # Pas 3306 : ta MariaDB Windows l'occupe tant qu'elle est installée
      - "127.0.0.1:3309:3306"

  site-prod-migrations:
    image: citadel-migrations:local
    build: &build
      # Chemin relatif au dossier de compose.yml (infra/) : la racine du dépôt
      context: ..
      target: migrations
      args:
        APP_VERSION: local
    # Sur le NAS, citadel lance les migrations à part (profil « jobs »). Ici, plus de
    # profil : `up` les lance, et le serveur attend qu'elles aient réussi (plus bas)
    profiles: !reset []

  site-prod-server:
    image: citadel-server:local
    build:
      <<: *build
      target: server
    environment:
      # Aucun vrai mail depuis ton PC : le journal écrit dans le log du serveur qu'un mail
      # serait parti (docker logs site-prod-server). La clé reçue est celle, factice, de
      # compose.local.env
      MAIL_SENDER: journal
    volumes:
      # À la place du dossier du NAS : un volume neuf, qui reprend de l'image son
      # propriétaire (node), effacé par prod:local:down
      - restore-journal:/var/lib/citadel/restore-journal
    depends_on:
      site-prod-migrations:
        condition: service_completed_successfully

  site-prod-client:
    image: citadel-client:local
    build:
      <<: *build
      target: client

  # La pré-prod : lancée par `up` comme le reste (sur le NAS, citadel ne fait que la créer)
  site-preprod-db:
    volumes:
      - preprod-db-data:/var/lib/mysql
      - type: bind
        source: ./mariadb-init.sh
        target: /docker-entrypoint-initdb.d/citadel.sh
        read_only: true
    ports: !override
      # 3307 et 3308 : les bases de dev et de test de ton PC (compose.dev.yml)
      - "127.0.0.1:3310:3306"

  # Mêmes images que la prod ; le build est répété pour que Compose ne cherche pas à les
  # télécharger (le cache de Docker le rend instantané)
  site-preprod-migrations:
    image: citadel-migrations:local
    build:
      <<: *build
      target: migrations

  site-preprod-server:
    image: citadel-server:local
    build:
      <<: *build
      target: server

  site-preprod-client:
    image: citadel-client:local
    build:
      <<: *build
      target: client

  infra-caddy:
    image: citadel-caddy:local
    build:
      <<: *build
      target: caddy
    ports: !override
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8002:8002"
    volumes:
      - site-public:/srv/public:ro

  # Tailscale : seulement sur le NAS (il lui faut un compte et le réseau de l'hôte).
  # Un profil jamais activé : `up` ne le lance pas.
  infra-tailscale:
    profiles: [nas-only]

  infra-ops:
    image: citadel-ops:local
    build:
      <<: *build
      target: ops
    environment:
      # Vide : aucun signal ne part vers healthchecks.io depuis ton PC
      HEALTHCHECKS_PING_KEY: ""
    volumes:
      # Le socket de Docker Desktop : les jobs pilotent les conteneurs de ce test
      - /var/run/docker.sock:/var/run/docker.sock
      # À la place de /Volume1/citadel : de quoi poser le verrou
      - ops-state:/Volume1/citadel
      # Et son state/, partagé avec la console comme sur le NAS (relevés pour la console)
      - admin-state:/Volume1/citadel/state
      # Les demandes de la console, et ce que Caddy sert (bandeau, maintenance)
      - console-queue:/Volume1/citadel/state/queue
      - site-public:/Volume1/citadel/state/public
      # Les sauvegardes, et le faux Drive où rclone les envoie chiffrées
      - backups:/Volume2/backups
      - fake-drive:/Volume2/drive
      # À la place de /Volume1/appdata : les configs de la stack média de ce test,
      # pour config-backup et config-verify. Un volume vide dessous, où Docker peut
      # créer leurs points de montage (le bind du NAS, en lecture seule, l'interdirait)
      - appdata:/Volume1/appdata
      - qbittorrent-config:/Volume1/appdata/qbittorrent:ro
      - jellyfin-config:/Volume1/appdata/jellyfin:ro
      - prowlarr-config:/Volume1/appdata/prowlarr:ro
      - radarr-config:/Volume1/appdata/radarr:ro
      - sonarr-config:/Volume1/appdata/sonarr:ro
      - bazarr-config:/Volume1/appdata/bazarr:ro
      - cross-seed-config:/Volume1/appdata/cross-seed:ro
      # Le faux Drive (pas un « config » de Compose : refusé sur un conteneur en
      # lecture seule)
      - ./rclone.local.conf:/Volume1/citadel/rclone.conf:ro

  infra-admin:
    image: citadel-admin:local
    build:
      <<: *build
      target: admin
    environment:
      # Hors de /state : un montage ne peut pas se créer dans un dossier en lecture seule
      PUBLIC_DIR: /public
    volumes:
      # Pas de déploiement sur ton PC : un state/ vide (« aucun déploiement »)
      - admin-state:/state:ro
      - site-public:/public:ro
      - console-queue:/queue
      - media-data:/hdd:ro
    ports: !override
      - "127.0.0.1:8100:8100"

  # --- Le faux Gluetun ---
  # Le vrai a besoin de ta clé WireGuard et monte un VPN : hors de question sur ton PC.
  # Celui-ci ne fait que tenir un réseau, auquel qBittorrent et les *arr se branchent
  # comme sur le NAS, et publier leurs ports. Il se dit sain tout de suite.
  # Il imite aussi le serveur de contrôle (port 8000) pour la console : deux fichiers
  # servis par le petit serveur web de busybox, avec une IP et un port inventés.
  # SANS VPN, donc : n'ajoute aucun torrent ici, il partirait avec ton IP.
  media-gluetun:
    image: busybox:1.37.0
    command: ["httpd", "-f", "-p", "8000", "-h", "/www"]
    # Un vrai processus n°1, qui transmet l'arrêt à httpd : arrêt immédiat, pas en 10 s
    init: true
    configs:
      - source: fake-gluetun-public-ip
        target: /www/v1/publicip/ip
      - source: fake-gluetun-port-forward
        target: /www/v1/portforward
    cap_add: !reset []
    devices: !reset []
    environment: !reset {}
    volumes: !reset []
    ports: !override
      - "127.0.0.1:8080:8080" # qBittorrent
      - "127.0.0.1:9696:9696" # Prowlarr
      - "127.0.0.1:7878:7878" # Radarr
      - "127.0.0.1:8989:8989" # Sonarr
      - "127.0.0.1:6767:6767" # Bazarr
      - "127.0.0.1:2468:2468" # cross-seed
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      start_period: 0s

  media-qbittorrent:
    volumes:
      - qbittorrent-config:/config
      - media-data:/data
    # Au premier démarrage, l'image copie /defaults/qBittorrent.conf dans /config : on lui
    # en donne un avec un compte connu (admin / adminadmin), au lieu du mot de passe au
    # hasard qu'elle écrirait dans ses logs. La console se connecte avec.
    configs:
      - source: qbittorrent-defaults
        target: /defaults/qBittorrent.conf

  media-jellyfin:
    environment:
      # Pas de pilote Intel à télécharger : aucun transcodage matériel sur ton PC
      DOCKER_MODS: ""
    volumes:
      - jellyfin-config:/config
      - media-data:/data/medias
    devices: !reset []
    group_add: !reset []
    ports: !override
      - "127.0.0.1:8096:8096"

  media-prowlarr:
    volumes:
      - prowlarr-config:/config

  media-radarr:
    volumes:
      - radarr-config:/config
      - media-data:/data

  media-sonarr:
    volumes:
      - sonarr-config:/config
      - media-data:/data

  media-bazarr:
    volumes:
      - bazarr-config:/config
      - media-data:/data

  media-cross-seed:
    volumes:
      - cross-seed-config:/config
      - media-data:/data
      - qbittorrent-config:/qbittorrent-check:ro
    # Sans config.js, cross-seed refuse de démarrer. Sur le NAS, c'est la tienne ; ici,
    # la plus petite acceptée : aucun indexeur, aucun client, il ne fait rien.
    configs:
      - source: cross-seed-config
        target: /config/config.js

configs:
  cross-seed-config:
    content: |
      module.exports = {
        torznab: [],
        useClientTorrents: false,
        dataDirs: [],
        linkDirs: [],
        torrentDir: null,
        action: "save",
        outputDir: null,
        matchMode: "strict",
        seasonFromEpisodes: null,
      };
  # Réponses du faux serveur de contrôle de Gluetun, au format du vrai
  fake-gluetun-public-ip:
    content: |
      {"public_ip":"203.0.113.42","country":"Switzerland","city":"Zurich"}
  fake-gluetun-port-forward:
    content: |
      {"port":51413}
  # Le qBittorrent.conf par défaut de l'image, plus le compte. Mot de passe « adminadmin »,
  # haché comme qBittorrent l'attend (PBKDF2-SHA512, sel:hachage en base64)
  qbittorrent-defaults:
    content: |
      [LegalNotice]
      Accepted=true

      [Preferences]
      Connection\UPnP=false
      Connection\PortRangeMin=6881
      Downloads\SavePath=/downloads/
      Downloads\TempPath=/downloads/incomplete/
      WebUI\Address=*
      WebUI\ServerDomains=*
      WebUI\Username=admin
      WebUI\Password_PBKDF2="@ByteArray(YQC+TrpOvjwCs1/bHXYUyw==:F78wstFtl+WX+sUztxX+dfqBObxx8AIVEx3pCxVqASO4leYRXnQv89iLS2WTS+Z+QX6O43aUefy8wH8qUbju7Q==)"

volumes:
  db-data:
  restore-journal:
  preprod-db-data:
  ops-state:
  admin-state:
  console-queue:
  site-public:
  backups:
  fake-drive:
  appdata:
  media-data:
  qbittorrent-config:
  jellyfin-config:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  bazarr-config:
  cross-seed-config:
