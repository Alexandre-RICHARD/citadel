# =====================================================================================
# compose.yml : LE projet Docker Compose du NAS, nommé « citadel »
# =====================================================================================
#
# Tous les conteneurs du NAS : le site (prod et pré-prod), Caddy, Tailscale, infra-ops
# (les jobs : sauvegardes, alertes, vpn-watch…), la console et son filtre Docker, et la
# stack média.
#
# Qui lit ce fichier ?
#   Jamais toi directement : il est copié dans l'image « ops », et c'est la commande
#   citadel (infra/citadel) qui le lance, depuis un conteneur ops de la bonne version.
#   Elle fournit deux choses :
#     - CITADEL_VERSION : le tag de nos images (v2026.10.25) ;
#     - --env-file /Volume1/citadel/.env.prod : les secrets, pour les ${…} de ce fichier.
#   `${NOM:?message}` arrête tout avec ce message si NOM manque : un oubli dans .env.prod
#   est signalé avant que quoi que ce soit ne change (citadel deploy, étape « Contrôle »).
#
# Chaque conteneur ne reçoit que SES variables (bloc environment) : le front ne voit pas
# le mot de passe de la base, Caddy ne voit pas celui d'IGDB.
#
# Les chemins de l'hôte sont absolus (/Volume1/…) : compose tourne dans un conteneur, et
# Docker les cherche sur le NAS. Un chemin relatif serait faux.
#
# Les labels citadel.* décrivent chaque service, pour citadel et la future console :
#   citadel.group         infra | site-prod | site-preprod | media
#   citadel.mode          always (toujours allumé) | on-demand (à la demande) | job (ponctuel)
#   citadel.controllable  la console peut le démarrer et l'arrêter
#   citadel.auto-stop     arrêté par infra-ops quand il tourne depuis plus longtemps (« 3h »)
#   citadel.release-notes où lire les notes de version d'une image tierce (console)

name: citadel

# --- Règles communes à tous les services, reprises par « <<: *defaults » ---
x-defaults:
  &defaults # Après un redémarrage du NAS, Docker relance ce qui tournait, et pas ce qu'on a arrêté
  restart: unless-stopped
  # Logs limités à 3 fichiers de 10 Mo par conteneur : le SSD ne se remplit jamais
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # Un processus du conteneur ne peut jamais gagner de droits (programmes « setuid »…)
  security_opt:
    - no-new-privileges:true

# --- En plus, pour NOS images : système de fichiers en lecture seule, aucune capacité ---
# Une faille dans notre code ne peut ni modifier l'image, ni rien faire de privilégié.
x-hardened: &hardened
  read_only: true
  cap_drop:
    - ALL

# --- Les variables des images linuxserver (qBittorrent, Jellyfin, *arr) ---
# PUID/PGID : l'utilisateur du NAS sous lequel elles tournent, propriétaire des fichiers
# de /Volume1/appdata/<service> et /Volume2/data. Ils dépendent de la machine : .env.prod.
x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:?manque dans .env.prod}
  PGID: ${PGID:?manque dans .env.prod}
  TZ: Europe/Paris

# --- Derrière le VPN : qBittorrent et les *arr vivent DANS le réseau de Gluetun ---
# Ils n'ont pas de réseau à eux : tout leur trafic sort par le tunnel du VPN, et si le VPN
# tombe, Gluetun coupe tout (kill-switch). Leurs ports sont donc publiés par Gluetun.
# Dans le même projet, Compose sait que Gluetun recréé = eux aussi à recréer.
x-behind-vpn: &behind-vpn
  network_mode: service:media-gluetun
  depends_on:
    media-gluetun:
      # Attendre que le VPN soit monté (healthcheck de Gluetun) avant de démarrer
      condition: service_healthy
      # Gluetun redémarré par Compose (citadel restart media-gluetun) : eux aussi, pour
      # rejoindre son nouveau réseau. Un redémarrage hors de Compose (reboot du NAS) est
      # rattrapé par vpn-watch, dans infra-ops.
      restart: true

services:
  # ===================================================================================
  # Le site en prod
  # ===================================================================================

  site-prod-db:
    <<: *defaults
    # Image tierce : version exacte, la même que sur ton PC (compose.dev.yml)
    image: mariadb:11.8.9
    container_name: site-prod-db
    # La base est petite : InnoDB garde 64 Mo de données en mémoire au lieu de 128 par
    # défaut, bien en dessous de la limite du conteneur (512 Mo)
    command: ["--innodb-buffer-pool-size=64M"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?manque dans .env.prod}
      # root n'est joignable que de l'intérieur du conteneur
      MARIADB_ROOT_HOST: localhost
      # Lus par mariadb-init.sh à la première initialisation : base et trois comptes
      DB_DATABASE_NAME: citadel
      DB_USER_NAME: citadel_app
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:?manque dans .env.prod}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?manque dans .env.prod}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?manque dans .env.prod}
    volumes:
      - /Volume1/appdata/site-prod-db:/var/lib/mysql
      # Copié là par citadel deploy depuis l'image ops. « create_host_path: false » :
      # si le fichier manque, le conteneur refuse de démarrer au lieu de créer une base
      # sans ses comptes.
      - type: bind
        source: /Volume1/citadel/mariadb-init.sh
        target: /docker-entrypoint-initdb.d/citadel.sh
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Seulement sur 127.0.0.1 du NAS : invisible du réseau, joignable par un tunnel
      # SSH (DBeaver)
      - "127.0.0.1:3306:3306"
    networks:
      - site
    healthcheck:
      # « sain » = initialisation finie et base prête (voir compose.dev.yml)
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      citadel.name: "Base du site"
      citadel.description: "MariaDB de la prod"
      citadel.group: "site-prod"
      citadel.mode: "always"
      citadel.controllable: "false"
      citadel.release-notes: "https://mariadb.com/docs/release-notes/community-server"

  site-prod-migrations:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-migrations:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: site-prod-migrations
    # Profil « jobs » : jamais lancé par `up`. citadel le lance à part, au bon moment
    # du déploiement (`run --rm site-prod-migrations migrate`), puis il disparaît.
    profiles: [jobs]
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:mariadb://site-prod-db:3306/citadel
      # Le compte qui a le droit de changer la structure de la base, et lui seul
      FLYWAY_USER: citadel_migrator
      FLYWAY_PASSWORD: ${DB_MIGRATOR_PASSWORD:?manque dans .env.prod}
    # Java écrit quelques fichiers temporaires
    tmpfs:
      - /tmp
    networks:
      - site
    depends_on:
      site-prod-db:
        condition: service_healthy
    labels:
      citadel.name: "Migrations"
      citadel.description: "Flyway : applique les migrations SQL de la version"
      citadel.group: "site-prod"
      citadel.mode: "job"
      citadel.controllable: "false"

  site-prod-server:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-server:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: site-prod-server
    environment:
      SERVER_PORT: "3000"
      DB_HOST: site-prod-db
      DB_PORT: "3306"
      DB_DATABASE_NAME: citadel
      # Le compte qui ne peut que lire et écrire des lignes
      DB_USER_NAME: citadel_app
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:?manque dans .env.prod}
      # Application Twitch du Backlog : le serveur en tire lui-même un token pour IGDB, et le
      # renouvelle quand il expire (plus rien à refaire à la main). Le navigateur ne les voit jamais
      INTERNET_GAME_DATA_BASE_CLIENT_ID: ${INTERNET_GAME_DATA_BASE_CLIENT_ID:?manque dans .env.prod}
      INTERNET_GAME_DATA_BASE_CLIENT_SECRET: ${INTERNET_GAME_DATA_BASE_CLIENT_SECRET:?manque dans .env.prod}
      # Les mails du site (formulaire de contact) partent vraiment, par l'API de Brevo. Les
      # seuils du quota quotidien gardent leurs valeurs par défaut (env.ts du serveur)
      MAIL_SENDER: brevo
      BREVO_API_KEY: ${BREVO_API_KEY:?manque dans .env.prod}
      # Clés de l'authentification (secrets de .env.prod, rangés dans Bitwarden) : sans elles,
      # le serveur refuse de démarrer (env.ts). HMAC : empreintes des codes envoyés par mail ;
      # TOTP : chiffrement des secrets de double authentification, avec la version de la clé.
      # La clé précédente ne sert que pendant une rotation : vide sinon, d'où « :- » (vide
      # accepté) au lieu de « :? »
      AUTH_CODE_HMAC_KEY: ${AUTH_CODE_HMAC_KEY:?manque dans .env.prod}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY:?manque dans .env.prod}
      AUTH_TOTP_ENCRYPTION_KEY_VERSION: ${AUTH_TOTP_ENCRYPTION_KEY_VERSION:?manque dans .env.prod}
      AUTH_TOTP_PREVIOUS_ENCRYPTION_KEY: ${AUTH_TOTP_PREVIOUS_ENCRYPTION_KEY:-}
      # Le journal de restauration : une ligne par suppression, changement d'email ou de
      # sécurité, rejouée après une restauration de la base. Hors de la base, sinon la
      # restauration l'effacerait avec elle
      AUTH_RESTORE_JOURNAL_DIR: /var/lib/citadel/restore-journal
    volumes:
      # Dans /Volume1/appdata : config-backup l'archive avec le reste. Le serveur (node,
      # 1000) y écrit : citadel deploy crée le dossier avec ce propriétaire. Le seul
      # dossier où il écrit, le reste de son système de fichiers est en lecture seule
      - /Volume1/appdata/site-prod-server/restore-journal:/var/lib/citadel/restore-journal
    networks:
      - site
      # edge : Caddy, qui lui envoie /api, et la sortie vers Internet (IGDB, Twitch, Brevo)
      - edge
    depends_on:
      site-prod-db:
        condition: service_healthy
    healthcheck:
      # /health répond 200 si la base répond (pas de curl dans l'image : Node fait la requête)
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      citadel.name: "API du site"
      citadel.description: "Serveur Express, derrière /api"
      citadel.group: "site-prod"
      citadel.mode: "always"
      citadel.controllable: "false"

  site-prod-client:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-client:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: site-prod-client
    # Aucune variable : la conf nginx est dans l'image, telle quelle (apps/client/nginx.conf),
    # et se lit sans rien écrire. Le seul dossier où nginx écrit, en mémoire, à son
    # utilisateur (101) : ses fichiers temporaires (pid, tampons des relais)
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      citadel.name: "Front du site"
      citadel.description: "nginx : fichiers du site, relais /irigo"
      citadel.group: "site-prod"
      citadel.mode: "always"
      citadel.controllable: "false"

  # ===================================================================================
  # La pré-prod : la prod en petit, arrêtée la plupart du temps
  # ===================================================================================
  # Mêmes images que la prod, sa propre base (citadel_preprod) : restaurée chaque nuit
  # depuis la prod par db-restore-test, et par chaque déploiement qui apporte des
  # migrations (répétition). http://<IP du NAS>:8002, en LAN ou par Tailscale,
  # servie par Caddy, jamais depuis Internet. Sans connexion.
  # Mode « on-demand » : citadel deploy la met à jour sans la démarrer. La démarrer :
  # la console, ou citadel start site-preprod.

  site-preprod-db:
    <<: *defaults
    image: mariadb:11.8.9
    container_name: site-preprod-db
    command: ["--innodb-buffer-pool-size=64M"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?manque dans .env.prod}
      MARIADB_ROOT_HOST: localhost
      # Mêmes comptes et mots de passe que la prod, mais des droits sur citadel_preprod
      # seulement : mariadb-init.sh les crée pour la base qu'on lui donne
      DB_DATABASE_NAME: citadel_preprod
      DB_USER_NAME: citadel_app
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:?manque dans .env.prod}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?manque dans .env.prod}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?manque dans .env.prod}
    volumes:
      - /Volume1/appdata/site-preprod-db:/var/lib/mysql
      - type: bind
        source: /Volume1/citadel/mariadb-init.sh
        target: /docker-entrypoint-initdb.d/citadel.sh
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Comme la prod : 127.0.0.1 du NAS, par tunnel SSH (DBeaver)
      - "127.0.0.1:3307:3306"
    networks:
      - site-preprod
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      citadel.name: "Base de pré-prod"
      citadel.description: "Copie de la base de prod, restaurée chaque nuit"
      citadel.group: "site-preprod"
      citadel.mode: "on-demand"
      citadel.controllable: "true"

  site-preprod-migrations:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-migrations:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: site-preprod-migrations
    # Comme celles de la prod : lancées par citadel, pendant la répétition d'un déploiement
    profiles: [jobs]
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:mariadb://site-preprod-db:3306/citadel_preprod
      FLYWAY_USER: citadel_migrator
      FLYWAY_PASSWORD: ${DB_MIGRATOR_PASSWORD:?manque dans .env.prod}
    tmpfs:
      - /tmp
    networks:
      - site-preprod
    depends_on:
      site-preprod-db:
        condition: service_healthy
    labels:
      citadel.name: "Migrations de pré-prod"
      citadel.description: "Flyway, pendant la répétition d'un déploiement"
      citadel.group: "site-preprod"
      citadel.mode: "job"
      citadel.controllable: "false"

  site-preprod-server:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-server:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: site-preprod-server
    environment:
      SERVER_PORT: "3000"
      DB_HOST: site-preprod-db
      DB_PORT: "3306"
      DB_DATABASE_NAME: citadel_preprod
      DB_USER_NAME: citadel_app
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:?manque dans .env.prod}
      INTERNET_GAME_DATA_BASE_CLIENT_ID: ${INTERNET_GAME_DATA_BASE_CLIENT_ID:?manque dans .env.prod}
      INTERNET_GAME_DATA_BASE_CLIENT_SECRET: ${INTERNET_GAME_DATA_BASE_CLIENT_SECRET:?manque dans .env.prod}
      # Jamais de vrai mail depuis la pré-prod : elle lit le même .env.prod que la prod, mais
      # le « journal » écrit seulement dans son log qu'un mail serait parti. Pas de clé Brevo
      MAIL_SENDER: journal
      # Les mêmes clés que la prod (même .env.prod). Clés de l'authentification (secrets de .env.prod, rangés dans Bitwarden) : sans elles,
      # le serveur refuse de démarrer (env.ts). HMAC : empreintes des codes envoyés par mail ;
      # TOTP : chiffrement des secrets de double authentification, avec la version de la clé.
      # La clé précédente ne sert que pendant une rotation : vide sinon, d'où « :- » (vide
      # accepté) au lieu de « :? »
      AUTH_CODE_HMAC_KEY: ${AUTH_CODE_HMAC_KEY:?manque dans .env.prod}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY:?manque dans .env.prod}
      AUTH_TOTP_ENCRYPTION_KEY_VERSION: ${AUTH_TOTP_ENCRYPTION_KEY_VERSION:?manque dans .env.prod}
      AUTH_TOTP_PREVIOUS_ENCRYPTION_KEY: ${AUTH_TOTP_PREVIOUS_ENCRYPTION_KEY:-}
      # Le journal de restauration de la pré-prod ne sert à rien (sa base est refaite à
      # chaque répétition) : en mémoire, perdu à l'arrêt, sans dossier sur le NAS
      AUTH_RESTORE_JOURNAL_DIR: /var/lib/citadel/restore-journal
    tmpfs:
      - /var/lib/citadel/restore-journal:uid=1000,gid=1000,mode=0700
    networks:
      - site-preprod
      - edge
    depends_on:
      site-preprod-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      citadel.name: "API de pré-prod"
      citadel.description: "Serveur Express, sur la base de pré-prod"
      citadel.group: "site-preprod"
      citadel.mode: "on-demand"
      citadel.controllable: "true"

  site-preprod-client:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-client:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: site-preprod-client
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      citadel.name: "Front de pré-prod"
      citadel.description: "nginx, servi par Caddy sur le port 8002"
      citadel.group: "site-preprod"
      citadel.mode: "on-demand"
      citadel.controllable: "true"

  # ===================================================================================
  # Infra
  # ===================================================================================

  infra-caddy:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-caddy:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: infra-caddy
    environment:
      # Jeton Cloudflare limité au DNS du domaine : certificats par challenge DNS
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?manque dans .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?manque dans .env.prod}
      # Absent de .env.prod : alexandre-richard.fr. Les tests sur ton PC mettent
      # citadel.localhost (infra/compose.local.env)
      SITE_DOMAIN: ${SITE_DOMAIN:-alexandre-richard.fr}
    ports:
      # TOS occupe les ports 80 et 443 du NAS : la box envoie 80 → 8001 et 443 → 4443
      - "8001:80"
      - "4443:443"
      # La pré-prod : la box ne l'envoie pas, LAN et Tailscale seulement
      - "8002:8002"
    volumes:
      # Certificats et comptes ACME, gardés d'une version à l'autre (volume Docker : il
      # reprend les droits de l'utilisateur caddy de l'image, sans réglage)
      - caddy-data:/data
      # Le bandeau et l'interrupteur du mode maintenance, écrits par infra-ops ; lecture seule
      - /Volume1/citadel/state/public:/srv/public:ro
    tmpfs:
      # Copie de travail de sa config, réécrite à chaque démarrage
      - /config:uid=1000,gid=1000,mode=0700
    networks:
      - edge
    depends_on:
      - site-prod-server
      - site-prod-client
    healthcheck:
      # L'API d'administration de Caddy, joignable seulement dans le conteneur
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      citadel.name: "Caddy"
      citadel.description: "Porte d'entrée web : HTTPS, routage du site et de Jellyfin"
      citadel.group: "infra"
      citadel.mode: "always"
      citadel.controllable: "false"

  infra-tailscale:
    <<: *defaults
    image: tailscale/tailscale:v1.104.4
    container_name: infra-tailscale
    # Le réseau du NAS lui-même, pas un réseau Docker : Tailscale y ajoute son interface,
    # et tes appareils joignent le NAS (SSH, TOS, ports des services) par son nom
    # Tailscale (NAS_HOSTNAME), de partout, sans port ouvert sur la box
    network_mode: host
    # Le nom que Tailscale annonce au tailnet, comme l'ancien conteneur : sans lui, ce
    # serait le nom système du NAS, et ce nom (ton alias ssh nas, les adresses par
    # Tailscale) pourrait changer. Dans .env.prod : un détail du réseau, hors du dépôt public.
    hostname: ${NAS_HOSTNAME:?manque dans .env.prod}
    environment:
      # Même dossier d'état que l'ancien conteneur « tailscale » : le NAS garde son
      # identité dans ton tailnet, sans se reconnecter. Les deux ne doivent jamais
      # tourner en même temps (la bascule arrête l'ancien d'abord, étape 24).
      TS_STATE_DIR: /config/state
      # Une vraie interface réseau (tailscale0), pas l'émulation logicielle
      TS_USERSPACE: "false"
    volumes:
      - /Volume1/appdata/tailscale:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    # Créer l'interface et régler les routes du NAS
    cap_add:
      - NET_ADMIN
      - NET_RAW
    deploy:
      resources:
        limits:
          # Il en utilise une quarantaine de Mo (inventaire, annexe A)
          memory: 256M
    labels:
      citadel.name: "Tailscale"
      citadel.description: "Le NAS sur ton réseau privé Tailscale"
      citadel.group: "infra"
      citadel.mode: "always"
      citadel.controllable: "false"
      citadel.release-notes: "https://tailscale.com/changelog"

  infra-ops:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-ops:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: infra-ops
    # Le planificateur (supercronic) lit infra/ops/crontab et lance les jobs à l'heure :
    # sauvegardes, test de restauration, site-check, vpn-watch… À côté, il surveille les
    # demandes de la console (state/queue/).
    command: ["cron"]
    # Un petit processus n°1 (tini) au-dessus de supercronic : il ramasse les processus
    # terminés des jobs, et supercronic n'écrit plus d'avertissement à chaque minute
    init: true
    # Trois droits de root rendus (cap_drop: ALL les retire tous) : lire tous les
    # fichiers de /Volume1/appdata pour l'archive, quel que soit leur propriétaire, et
    # donner state/queue/ à la console. Rien de plus qu'avant : piloter Docker par son
    # socket, c'est déjà être root sur le NAS.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      # rclone, crane : leurs petits fichiers de travail, dans /tmp (le reste est en
      # lecture seule)
      HOME: /tmp
      # Les variables de .env.prod dont les jobs ont besoin, et rien d'autre
      HEALTHCHECKS_PING_KEY: ${HEALTHCHECKS_PING_KEY:?manque dans .env.prod}
      QBITTORRENT_USER: ${QBITTORRENT_USER:?manque dans .env.prod}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?manque dans .env.prod}
      SITE_DOMAIN: ${SITE_DOMAIN:-alexandre-richard.fr}
    networks:
      # ops : la sortie vers Internet (Drive, healthchecks.io, site-check, registres
      # d'images). Il n'écoute toujours rien.
      - ops
      # vpn : qBittorrent, dans le réseau de Gluetun (qbittorrent-stats)
      - vpn
    volumes:
      # Piloter le Docker du NAS. Donne tous les droits sur le NAS : ce conteneur
      # n'exécute que les scripts de son image, et n'écoute sur aucun port.
      - /var/run/docker.sock:/var/run/docker.sock
      # Le verrou partagé avec citadel deploy (state/lock), rclone.conf, et tout ce qu'il
      # dépose pour la console et pour Caddy dans state/
      - /Volume1/citadel:/Volume1/citadel
      # Les sauvegardes, sur le HDD
      - /Volume2/backups:/Volume2/backups
      # Ce que config-backup archive : lecture seule
      - /Volume1/appdata:/Volume1/appdata:ro
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # rclone, zstd et tar pendant config-backup : de la marge
          memory: 512M
    labels:
      citadel.name: "Tâches planifiées"
      citadel.description: "infra-ops : sauvegardes, alertes, vpn-watch, demandes de la console"
      citadel.group: "infra"
      citadel.mode: "always"
      citadel.controllable: "false"

  # --- Le filtre entre la console et Docker ---
  # Le socket de Docker donne tous les droits sur le NAS. La console ne le voit jamais :
  # elle parle à ce petit proxy, qui ne laisse passer que les requêtes de ses listes
  # (méthode + chemin), et refuse tout le reste (créer un conteneur, exécuter une
  # commande dedans, toucher aux images, aux volumes…).
  infra-socket-proxy:
    <<: [*defaults, *hardened]
    image: wollomatic/socket-proxy:1.13.2
    container_name: infra-socket-proxy
    # Personne (65534), avec le groupe propriétaire du socket : juste de quoi l'ouvrir.
    # Le groupe dépend de la machine : `stat -c %g /var/run/docker.sock` sur le NAS.
    user: "65534:${DOCKER_GID:?manque dans .env.prod}"
    command:
      - -loglevel=warn
      # Écouter sur son réseau Docker, mais ne répondre qu'à la console
      - -listenip=0.0.0.0
      - -allowfrom=infra-admin
      # Les listes : des expressions régulières sur le chemin, ancrées au début et à la
      # fin. « (/v1.xx)? » : avec ou sans numéro de version de l'API devant.
      # GET : liste, détail, statistiques et logs des conteneurs. Rien d'autre.
      - -allowGET=(/v1\.[0-9]+)?/containers/(json|[a-zA-Z0-9_.-]+/(json|stats|logs))
      # POST : démarrer, arrêter. Un redémarrage, pour la console, c'est l'un puis l'autre.
      - -allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop)
      # Son healthcheck, sur 127.0.0.1 du conteneur seulement
      - -allowhealthcheck
      - -shutdowngracetime=5
    volumes:
      # :ro empêche de remplacer le fichier du socket, pas de lui parler : c'est le
      # proxy qui filtre
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 2
    deploy:
      resources:
        limits:
          memory: 32M
    labels:
      citadel.name: "Filtre Docker"
      citadel.description: "Ne laisse passer vers Docker que ce dont la console a besoin"
      citadel.group: "infra"
      citadel.mode: "always"
      citadel.controllable: "false"
      citadel.release-notes: "https://github.com/wollomatic/socket-proxy/releases"

  # --- La console d'administration ---
  # http://<IP du NAS>:8100 chez toi, http://<nom Tailscale>:8100 par Tailscale ; jamais depuis
  # Internet (la box n'envoie que 80 et 443, à Caddy). Protégée par son mot de passe.
  infra-admin:
    <<: [*defaults, *hardened]
    image: ghcr.io/alexandre-richard/citadel-admin:${CITADEL_VERSION:?version manquante, passer par citadel}
    container_name: infra-admin
    environment:
      TZ: Europe/Paris
      ADMIN_PORT: "8100"
      # Le hachage de son mot de passe, jamais le mot de passe : citadel admin-password
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?manque dans .env.prod, voir citadel admin-password}
      # Docker, à travers le filtre
      DOCKER_API_URL: http://infra-socket-proxy:2375
      # qBittorrent et le serveur de contrôle de Gluetun, dans le réseau de Gluetun
      QBITTORRENT_URL: http://media-gluetun:8080
      QBITTORRENT_USER: ${QBITTORRENT_USER:?manque dans .env.prod}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?manque dans .env.prod}
      GLUETUN_URL: http://media-gluetun:8000
      GLUETUN_API_KEY: ${GLUETUN_API_KEY:?manque dans .env.prod}
      # Les lectures en cours, avec une clé créée dans Jellyfin pour la console
      JELLYFIN_URL: http://media-jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?manque dans .env.prod}
      # Caddy : ses logs d'accès (lus par le filtre Docker) et les dates de ses
      # certificats (lues en HTTPS, sans accès à ses fichiers ni à ses clés)
      CADDY_CONTAINER: infra-caddy
      SITE_DOMAIN: ${SITE_DOMAIN:-alexandre-richard.fr}
      # Le serveur du site, joint directement par le réseau edge (pas par Caddy, qui refuse
      # /api/internal depuis Internet) : le nombre de mails qui n'ont pas pu partir cette
      # semaine. Pas de préfixe /api : c'est Caddy qui le retire, et on ne passe pas par lui
      SITE_API_URL: http://site-prod-server:3000
      # Ce qu'écrivent citadel et infra-ops : version en service, historique des
      # déploiements, jobs, sauvegardes, résultats des demandes
      STATE_DIR: /state
      # Où la console dépose ses demandes à infra-ops
      QUEUE_DIR: /queue
      # Le bandeau et le mode maintenance du site, qu'elle affiche
      PUBLIC_DIR: /state/public
      # Espace libre des deux disques : un dossier de chacun suffit
      SSD_PATH: /state
      HDD_PATH: /hdd
    volumes:
      # En lecture seule. Seulement state/ : pas .env.prod, qui est à côté
      - /Volume1/citadel/state:/state:ro
      # Sa seule écriture : les demandes, qu'infra-ops vérifie avant d'exécuter
      - /Volume1/citadel/state/queue:/queue
      # Seul son espace libre est lu (statfs) ; lecture seule
      - /Volume2/data:/hdd:ro
    ports:
      - "8100:8100"
    networks:
      # Le filtre Docker
      - docker-api
      # Gluetun, donc qBittorrent
      - vpn
      # Caddy, Jellyfin et le serveur du site ; et la sortie vers Internet, pour Twitch
      - edge
    depends_on:
      - infra-socket-proxy
    healthcheck:
      # /health répond sans session (pas de curl dans l'image : Node fait la requête)
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      citadel.name: "Console"
      citadel.description: "La console d'administration, sur le port 8100"
      citadel.group: "infra"
      citadel.mode: "always"
      citadel.controllable: "false"

  # ===================================================================================
  # La stack média
  # ===================================================================================
  # Versions figées, jamais « latest » : pour les images linuxserver, le tag de
  # build complet, qui désigne toujours la même image. Au départ, exactement celles qui
  # tournaient sur le NAS (relevé du 25 octobre 2026) : la bascule ne change que la
  # façon de les lancer ; les mises à jour viendront ensuite, une par une. Exception,
  # Gluetun : le NAS avait une version de développement (« latest » d'avril), remplacée
  # par la version publiée suivante (il ne garde aucune donnée). Mettre à jour = changer le tag
  # ici, commiter, pnpm release ; revenir en arrière = citadel rollback. Attention : les
  # *arr et Jellyfin migrent leur base en démarrant sur une version plus récente, et ne
  # savent pas revenir à l'ancienne. Avant une grosse mise à jour d'un des leurs, une
  # copie de son dossier /Volume1/appdata/<service> s'impose.
  #
  # Mode « on-demand » : citadel deploy les met à jour sans les démarrer s'ils sont
  # arrêtés. Les démarrer : citadel start media (ou un seul : citadel start media-radarr).
  #
  # Ports : rien n'est ouvert vers Internet (la box n'envoie que 80 et 443, à Caddy). Ils
  # répondent sur le LAN et par Tailscale (http://<NAS>:7878).

  media-gluetun:
    <<: *defaults
    image: qmcgaw/gluetun:v3.41.3
    container_name: media-gluetun
    # Créer le tunnel du VPN et régler le pare-feu du kill-switch
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: Europe/Paris
      # ProtonVPN en WireGuard. La clé privée est le seul secret de la stack média.
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?manque dans .env.prod}
      SERVER_COUNTRIES: Switzerland
      # Port forwarding : Proton ouvre un port vers qBittorrent (indispensable pour bien
      # partager). Seuls les serveurs qui le proposent sont choisis.
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      PORT_FORWARD_ONLY: "on"
      # Ce port change à chaque connexion : Gluetun le donne aussitôt à qBittorrent, par
      # son API (qBittorrent accepte sans mot de passe ce qui vient de 127.0.0.1)
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- --retry-connrefused
        --post-data "json={\"listen_port\":{{PORTS}}}"
        http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      # DNS chiffré (DNS over TLS) chez Cloudflare et Quad9 : le fournisseur d'accès ne
      # voit pas les noms demandés. L'ancienne config utilisait des noms de variables
      # (DOT, DNS_UPSTREAM_PLAIN_ADDRESSES…) que cette version ne connaît pas.
      DNS_UPSTREAM_RESOLVER_TYPE: DoT
      DNS_UPSTREAM_RESOLVERS: cloudflare,quad9
      BLOCK_MALICIOUS: "off"
      # Le LAN reste joignable depuis le tunnel (les *arr appellent Jellyfin par son IP).
      # Dans .env.prod, comme le nom du NAS : un détail du réseau, hors du dépôt public.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:?manque dans .env.prod}
      # Liste des serveurs de Proton remise à jour chaque jour
      UPDATER_PERIOD: 24h
      # Son serveur de contrôle (port 8000, jamais publié) : la console y lit l'IP de
      # sortie et le port redirigé. Chaque route exige cette clé d'API (en-tête X-API-Key)
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?manque dans .env.prod}"}'
    volumes:
      # Sa liste de serveurs, gardée d'un démarrage à l'autre. Même dossier que l'ancien
      # conteneur, mais monté là où Gluetun écrit vraiment (/gluetun) : l'ancien le
      # montait sur /config, que Gluetun n'utilise pas
      - /Volume1/appdata/gluetun:/gluetun
    ports:
      # Les interfaces de ceux qui vivent dans son réseau
      - "8080:8080" # qBittorrent
      - "9696:9696" # Prowlarr
      - "7878:7878" # Radarr
      - "8989:8989" # Sonarr
      - "6767:6767" # Bazarr
      - "2468:2468" # cross-seed
    networks:
      - vpn
    # Healthcheck : celui de l'image (« sain » = tunnel monté et Internet joignable)
    cpu_shares: 416
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1000M
    labels:
      citadel.name: "Gluetun"
      citadel.description: "VPN ProtonVPN des téléchargements, avec kill-switch"
      citadel.group: "media"
      citadel.mode: "always"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/qdm12/gluetun/releases"

  media-qbittorrent:
    <<: [*defaults, *behind-vpn]
    image: lscr.io/linuxserver/qbittorrent:5.1.4-r3-ls453
    container_name: media-qbittorrent
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: "8080"
    volumes:
      - /Volume1/appdata/qbittorrent:/config
      # /data commun à qBittorrent et aux *arr, sur un seul volume : les imports sont des
      # liens durs (hardlinks), sans copie ni place en plus
      - /Volume2/data:/data
    healthcheck:
      # La page de connexion répond : l'interface est prête
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://127.0.0.1:8080/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Priorité basse : le NAS reste fluide pendant les téléchargements
    cpu_shares: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 3000M
    labels:
      citadel.name: "qBittorrent"
      citadel.description: "Téléchargements, à travers le VPN"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/linuxserver/docker-qbittorrent/releases"

  media-jellyfin:
    <<: *defaults
    # La 12 est sortie en octobre 2026, avec une migration de sa base : passage à faire
    # à part, après une copie de /Volume1/appdata/jellyfin.
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls47
    container_name: media-jellyfin
    environment:
      <<: *linuxserver-env
      # Ajoute au démarrage le pilote OpenCL d'Intel : tone mapping HDR sur le GPU du N95
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - /Volume1/appdata/jellyfin:/config
      - /Volume2/data/medias:/data/medias
    # Transcodage matériel : la puce graphique du N95 (Intel Quick Sync)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # Le groupe « render » du NAS, qui a le droit d'utiliser /dev/dri
      - ${RENDER_GROUP:?manque dans .env.prod}
    ports:
      # Sur le LAN et par Tailscale ; depuis Internet, c'est Caddy (jellyfin.<domaine>)
      - "8096:8096"
    networks:
      # Celui de Caddy, qui le sert sous jellyfin.<domaine>. Il sort aussi sur Internet
      # (images et fiches des films).
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://127.0.0.1:8096/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Le pilote OpenCL s'installe au premier démarrage
      start_period: 120s
    # Priorité haute : une lecture ne doit pas saccader
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 5000M
    labels:
      citadel.name: "Jellyfin"
      citadel.description: "Films et séries en streaming, seul service média exposé"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/linuxserver/docker-jellyfin/releases"

  media-prowlarr:
    <<: [*defaults, *behind-vpn]
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    container_name: media-prowlarr
    environment:
      <<: *linuxserver-env
    volumes:
      - /Volume1/appdata/prowlarr:/config
    healthcheck:
      # /ping : la réponse de santé des *arr, sans clé d'API
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://127.0.0.1:9696/ping",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
    labels:
      citadel.name: "Prowlarr"
      citadel.description: "Indexeurs, partagés avec Radarr et Sonarr"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/linuxserver/docker-prowlarr/releases"
      # Allumé pour une recherche, éteint seul 3 h plus tard (job auto-stop)
      citadel.auto-stop: "3h"

  media-radarr:
    <<: [*defaults, *behind-vpn]
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
    container_name: media-radarr
    environment:
      <<: *linuxserver-env
    volumes:
      - /Volume1/appdata/radarr:/config
      - /Volume2/data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://127.0.0.1:7878/ping",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
    labels:
      citadel.name: "Radarr"
      citadel.description: "Films : recherche et import"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/linuxserver/docker-radarr/releases"
      citadel.auto-stop: "3h"

  media-sonarr:
    <<: [*defaults, *behind-vpn]
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: media-sonarr
    environment:
      <<: *linuxserver-env
    volumes:
      - /Volume1/appdata/sonarr:/config
      - /Volume2/data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://127.0.0.1:8989/ping",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
    labels:
      citadel.name: "Sonarr"
      citadel.description: "Séries : recherche et import"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/linuxserver/docker-sonarr/releases"
      citadel.auto-stop: "3h"

  media-bazarr:
    <<: [*defaults, *behind-vpn]
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls370
    container_name: media-bazarr
    environment:
      <<: *linuxserver-env
    volumes:
      - /Volume1/appdata/bazarr:/config
      - /Volume2/data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://127.0.0.1:6767/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
    labels:
      citadel.name: "Bazarr"
      citadel.description: "Sous-titres des films et séries"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/linuxserver/docker-bazarr/releases"
      citadel.auto-stop: "3h"

  media-cross-seed:
    <<: [*defaults, *behind-vpn]
    image: ghcr.io/cross-seed/cross-seed:6.13.9
    container_name: media-cross-seed
    command: ["daemon"]
    environment:
      <<: *linuxserver-env
    volumes:
      - /Volume1/appdata/cross-seed:/config
      - /Volume2/data:/data
      # Les .torrent de qBittorrent, en lecture seule : cross-seed y cherche ce qu'on a déjà
      - /Volume1/appdata/qbittorrent/qBittorrent/BT_backup:/qbittorrent-check:ro
    depends_on:
      # Réécrit en entier (une clé redéfinie remplace celle de *behind-vpn) : Gluetun,
      # plus les *arr qu'il interroge, démarrés avec lui
      media-gluetun:
        condition: service_healthy
        restart: true
      media-prowlarr:
        condition: service_started
      media-radarr:
        condition: service_started
      media-sonarr:
        condition: service_started
    healthcheck:
      # Pas de curl dans cette image : wget. /api/ping répond sans la clé d'API.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:2468/api/ping",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500M
    labels:
      citadel.name: "cross-seed"
      citadel.description: "Repartage ce qui existe déjà sur d'autres trackers"
      citadel.group: "media"
      citadel.mode: "on-demand"
      citadel.controllable: "true"
      citadel.release-notes: "https://github.com/cross-seed/cross-seed/releases"
      # Il interroge les *arr : éteint avec eux
      citadel.auto-stop: "3h"

# --- Réseaux séparés : un conteneur ne joint que ceux de ses réseaux ---
networks:
  # Caddy et ce qu'il sert, plus la console, qui lit Jellyfin, les certificats de Caddy et
  # les échecs de mails du serveur du site.
  # Sort sur Internet : certificats, relais du front (Irigo), appels du serveur à IGDB
  edge: {}
  # Le serveur et sa base. Pas « internal » : Docker ne publierait plus le port de la
  # base sur 127.0.0.1, dont DBeaver a besoin
  site: {}
  # Gluetun (qBittorrent et les *arr n'ont pas de réseau à eux, ils utilisent celui de
  # Gluetun), la console, qui lit qBittorrent et Gluetun, et infra-ops (qbittorrent-stats)
  vpn: {}
  # La console et le filtre Docker. « internal » : aucune sortie vers Internet
  docker-api:
    internal: true
  # infra-ops et les conteneurs qu'il lance : la sortie vers Internet (Drive,
  # healthchecks.io, site-check, registres d'images)
  ops: {}
  # La base et le serveur de la pré-prod, séparés de la prod
  site-preprod: {}

volumes:
  caddy-data:
