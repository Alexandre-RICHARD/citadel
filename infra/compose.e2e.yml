# =====================================================================================
# compose.e2e.yml : prod:local + de quoi lire les emails, pour les tests end-to-end
# =====================================================================================
#
#   pnpm stack-up      (depuis e2e/) lance la stack de prod:local (compose.local.yml) avec ce fichier par-dessus
#   pnpm stack-down    arrête tout et efface les données (base, emails) : repart de zéro
#
# Puis les tests : pnpm test-e2e, toujours depuis e2e/ (voir docs/e2e/e2e.md).
#   http://localhost:8025   Mailpit : la boîte de réception de tous les emails du site
#
# Compose superpose ce fichier à compose.yml et compose.local.yml (troisième -f) : on
# teste donc toujours la vraie stack, avec seulement ces différences :
#   - le serveur envoie ses emails par le VRAI client Brevo (MAIL_SENDER=brevo : même code,
#     même format de requête que la prod), mais l'adresse de l'API (BREVO_API_URL) pointe
#     vers notre faux Brevo, pas vers api.brevo.com. Aucun email ne sort de ton PC, aucun
#     crédit Brevo n'est dépensé ;
#   - le faux Brevo (e2e-fake-brevo) reçoit la requête et dépose l'email dans Mailpit ;
#   - Mailpit garde les emails, les montre dans une page web, et les rend aux tests par
#     une API (GET /api/v1/messages…) ;
#   - les limites par IP sont relevées : tous les tests viennent de la même IP (la tienne)
#     et inscrire des dizaines de comptes à la suite ferait sinon bannir cette IP.

services:
  site-prod-server:
    environment:
      MAIL_SENDER: brevo
      # Le nom du service sur le réseau « site » ; /v3 comme chez Brevo
      BREVO_API_URL: http://e2e-fake-brevo:3001/v3
      # Limites par IP (les limites par adresse restent celles de la prod : un test
      # ne doit pas en dépendre, il crée ses adresses)
      AUTH_REGISTRATIONS_PER_IP_PER_HOUR: "100000"
      AUTH_MAILS_PER_IP_PER_HOUR: "100000"
      AUTH_MAILS_PER_IP_PER_DAY: "100000"
      AUTH_USERNAME_CHECKS_PER_IP_PER_HOUR: "100000"
      AUTH_IP_FAILURES_BEFORE_BAN: "100000"
      CONTACT_HOURLY_LIMIT_PER_IP: "100000"
    depends_on:
      e2e-fake-brevo:
        condition: service_healthy

  # --- Le faux Brevo ---
  # Un petit serveur Node (e2e/src/fake-brevo/server.mjs, lu depuis le dépôt : pas d'image à
  # construire) qui parle comme l'API de Brevo, juste assez pour notre BrevoClient :
  #   POST /v3/smtp/email   envoi d'un email : il le dépose dans Mailpit
  #   GET  /v3/account      le compteur de crédits (toujours plein : le quota ne bloque jamais)
  e2e-fake-brevo:
    image: node:24.22.1-alpine3.24
    container_name: e2e-fake-brevo
    restart: "no"
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: "3001"
      MAILPIT_URL: http://e2e-mailpit:8025
    volumes:
      - ../e2e/src/fake-brevo/server.mjs:/app/server.mjs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - site
    depends_on:
      e2e-mailpit:
        condition: service_healthy
    healthcheck:
      # Pas de curl dans l'image : Node fait la requête
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/v3/account').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Mailpit ---
  # Garde en mémoire tous les emails reçus (donc vidés à chaque redémarrage) et les montre
  # sur http://localhost:8025. Son port SMTP (1025) ne sert à rien ici : le faux Brevo
  # utilise son API d'envoi. Version fixée, comme toutes les images de l'infra.
  e2e-mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: e2e-mailpit
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - site
    # L'image définit déjà son healthcheck (/mailpit readyz)
