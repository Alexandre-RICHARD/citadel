# =====================================================================================
# images.yml : construit les images de Citadel et les publie sur ghcr.io (§7)
# =====================================================================================
#
# Déclenché seulement par un tag v* (créé par `pnpm release`) : un commit seul ne lance
# rien, puisque tu travailles sur main. Pas de validate-all ici : tu le lances avant
# chaque push, et `pnpm release` le relance avant de créer le tag.
#
# Une image par étape (« target ») du Dockerfile de la racine, construites en parallèle,
# publiées sous ghcr.io/alexandre-richard/citadel-<image>:<tag>. Le NAS les télécharge
# ensuite (citadel deploy <tag>) : GitHub n'a aucun accès au NAS, ni aucun secret de prod.
# Aucun secret à créer chez GitHub : le jeton GITHUB_TOKEN est fourni pour chaque lancement.
name: Images

on:
  push:
    tags: ["v*"]

# Droits du GITHUB_TOKEN : lire le code, publier les images. Rien d'autre.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        # Une étape du Dockerfile par image ; admin s'ajoutera à l'étape 21
        image: [client, server, migrations, ops, caddy]
    steps:
      # Chaque action est épinglée par le SHA d'un commit (un tag peut être déplacé,
      # un SHA non) ; la version lisible est en commentaire, pour les mises à jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique, pour le contrôle suivant
          fetch-depth: 0
          # Le jeton ne reste pas dans .git après le checkout : rien ne s'en sert ensuite
          persist-credentials: false

      - name: Le tag est-il sur main ?
        # Refuse un tag posé sur un commit absent de main (une branche d'essai…)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # buildx : le constructeur d'images de Docker, avec cache et plusieurs plateformes
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          # Le N95 du NAS est un processeur x86_64
          platforms: linux/amd64
          push: true
          # Gravé dans les images : /health et version.json disent quelle version tourne
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ghcr.io/alexandre-richard/citadel-${{ matrix.image }}:${{ github.ref_name }}
          # Cache des couches chez GitHub, une réserve par image : seules les étapes
          # modifiées sont reconstruites (dépendances en cache tant que le lockfile ne change pas)
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
