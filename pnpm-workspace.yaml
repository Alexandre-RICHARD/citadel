  esbuild: true
  unrs-resolver: true

catalog:
  # dependencies
  "lucide-react": "^1.77.0"
  "react": "^19.3.1"
  "react-dom": "^19.3.1"
  "express": "^5.3.0"
  "zod": "^4.6.7"

  # devDependencies
  "@testing-library/react": "^16.3.3"
  "@types/express": "^5.0.3"
  "@types/node": "^26.6.6"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.3.0"
  "esbuild": "^0.28.2"
  "eslint": "^10.15.0"
  "globals": "^17.14.0"
  "jsdom": "^31.0.0"
  "sass": "^1.108.2"
  "tsx": "^4.23.15"
  "typescript": "^6.0.3"
  "vite": "^8.3.8"
  "vitest": "^5.1.1"

minimumReleaseAgeExclude:
  - playwright-core@1.65.0
