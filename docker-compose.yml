services:
  db-init:
    image: alpine:3.19
    env_file:
      - .env
    volumes:
      - ./db-init:/templates:ro
      - ./db-init-generated:/generated
    command: >
      sh -c "apk add --no-cache gettext &&
             envsubst < /templates/00_init_database.sql.template > /generated/00-init.sql"
    restart: "no"

  migrations:
    image: ghcr.io/alexandre-richard/reunification-backend:${BACKEND_VERSION}
    command: >
      sh -c "
      if [ -d /app/migrations ] && [ \"$(ls -A /app/migrations)\" ]; then
        cp -r /app/migrations/* /shared-migrations;
      else
        echo 'No migrations found';
      fi
      "
    volumes:
      - backend-migrations:/shared-migrations
    networks:
      - app-network
    restart: "no"

  mariadb:
    image: mariadb:11
    container_name: mariadb
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mariadb-data:/var/lib/mysql
      - ./db-init-generated:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always
    networks:
      - app-network
    ports:
      - "127.0.0.1:3306:${DB_PORT}"

  flyway:
    image: flyway/flyway:10
    container_name: flyway
    depends_on:
      migrations:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    volumes:
      - backend-migrations:/flyway/sql
    command: >
      migrate
      -connectRetries=10
      -url=jdbc:${DB_DRIVER}://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
      -user=${DB_USER_NAME}
      -password=${DB_USER_PASSWORD}
    networks:
      - app-network
    restart: on-failure:3

  backend:
    image: ghcr.io/alexandre-richard/reunification-backend:${BACKEND_VERSION}
    container_name: backend
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      LOCAL_PORT: ${LOCAL_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_DRIVER: ${DB_DRIVER}
      DB_HOST: ${DB_HOST}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      DB_PORT: ${DB_PORT}
    expose:
      - "${LOCAL_PORT}"
    restart: always
    networks:
      - app-network

  frontend:
    image: ghcr.io/alexandre-richard/reunification-frontend:${FRONTEND_VERSION}
    container_name: frontend-builder
    command: ["sh", "-c", "cp -r /app/build/* /usr/share/nginx/html"]
    volumes:
      - front_build:/usr/share/nginx/html
    restart: "no"
    networks:
      - app-network

  nginx:
    image: nginx:1.26-alpine
    container_name: nginx
    depends_on:
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/front.conf:/etc/nginx/conf.d/front.conf:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - front_build:/usr/share/nginx/html:ro
    restart: always
    networks:
      - app-network
      - proxy-net

volumes:
  front_build:
  backend-migrations:

networks:
  app-network:
    driver: bridge
  proxy-net:
    external: true
